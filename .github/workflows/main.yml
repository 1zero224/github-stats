name: Generate Stats Images

on:
  push:
    branches: [ master ]
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Check out repository under $GITHUB_WORKSPACE, so the job can access it
    - uses: actions/checkout@v4

    # Run using Python 3.12 for consistency and aiohttp
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: 'x64'
        cache: 'pip'

    # Install dependencies with `pip`
    - name: Install requirements
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -r requirements.txt

    # Persist per-repository authored language results between runs. The cache
    # is not committed because it contains private repository names.
    - name: Restore authored languages cache
      uses: actions/cache@v4
      with:
        path: generated/authored_languages_cache.json
        key: authored-languages-${{ github.run_id }}
        restore-keys: |
          authored-languages-

    # Generate all statistics images
    - name: Generate images
      run: |
        python --version
        python generate_images.py
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EXCLUDED: ${{ secrets.EXCLUDED }}
        EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
        # Skip data/annotation dumps in the language badge only.
        EXCLUDED_LANGUAGE_REPOS: 1zero224/defect-synthesis
        EXCLUDE_FORKED_REPOS: true
        ADDITIONAL_USERNAMES: ${{ secrets.ADDITIONAL_USERNAMES }}
        # Count only lines added in commits authored by the user instead of
        # every file in every repository (GitHub's byte-based statistics).
        LANGUAGE_MODE: authored

    # Commit all changed files to the repository
    - name: Commit to the repo
      run: |
        git config --global user.name "jstrieb/github-stats"
        git config --global user.email "github-stats[bot]@jstrieb.github.io"
        git add .
        # Force the build to succeed, even if no files were changed
        git commit -m 'Update generated files' || true
        git push
